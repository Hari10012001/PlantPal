# PlantPal Application Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database DataSource Configuration (Credentials loaded from Environment Variables)
spring.datasource.url=jdbc:mysql://localhost:3306/plantpal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Default Admin Configuration (Loaded via Environment Variable)
app.admin.email=admin@plantpal.local
app.admin.password=${ADMIN_PASSWORD:}

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Application Information
app.name=PlantPal
app.version=1.0.0
app.description=Personal Plant Care, Watering Schedule and Growth Monitoring Platform