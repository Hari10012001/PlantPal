# PlantPal Application Configuration

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL / TiDB Database DataSource Configuration (Credentials loaded from Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plantpal_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration (Cloud & TiDB Optimized)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Default Admin Configuration (Loaded via Environment Variable)
app.admin.email=admin@plantpal.local
app.admin.password=${ADMIN_PASSWORD:}

# Static Resources
spring.web.resources.static-locations=classpath:/static/

# Application Information
app.name=PlantPal
app.version=1.1.1
app.description=Personal Plant Care, Watering Schedule and Growth Monitoring Platform