<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantPal - Personal Plant Care Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fdf9;
            color: #2d6a4f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d8f3dc;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.08);
            text-align: center;
            max-width: 500px;
        }
        h1 { margin-top: 0; color: #1b4332; }
        p { color: #40916c; line-height: 1.6; }
        .badge {
            display: inline-block;
            background-color: #52b788;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌱 PlantPal</h1>
        <div class="badge">Milestone 1 Verified</div>
        <p>Personal Plant Care, Watering Schedule and Growth Monitoring Platform</p>
        <p><small>Backend Spring Boot Service is Running Successfully.</small></p>
    </div>
</body>
</html>
